<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>쿠키를 소개합니다</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: linear-gradient(160deg, #ffe4ec 0%, #fff4d6 50%, #e3f4ff 100%);
      color: #5a4a5e;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #fffdfb;
      border-radius: 32px;
      padding: 40px 28px 32px;
      text-align: center;
      box-shadow: 0 12px 32px rgba(214, 160, 190, 0.25);
    }

    .cat {
      font-size: 88px;
      line-height: 1;
      display: inline-block;
      animation: wiggle 2.4s ease-in-out infinite;
    }

    @keyframes wiggle {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-6deg); }
      75% { transform: rotate(6deg); }
    }

    h1 {
      margin-top: 16px;
      font-size: 32px;
      color: #e889a8;
    }

    .tagline {
      margin-top: 8px;
      font-size: 16px;
      color: #9a8a9e;
    }

    h2 {
      margin-top: 32px;
      font-size: 18px;
      color: #7cb8d9;
    }

    ul {
      list-style: none;
      margin-top: 16px;
      display: grid;
      gap: 12px;
    }

    li {
      padding: 14px 18px;
      border-radius: 18px;
      font-size: 17px;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
    }

    li:nth-child(1) { background: #ffe4ec; }
    li:nth-child(2) { background: #e8f6e8; }
    li:nth-child(3) { background: #ece6ff; }

    li span { font-size: 26px; }

    footer {
      margin-top: 32px;
      font-size: 13px;
      color: #b8a9bc;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="cat">🐱</div>
    <h1>쿠키</h1>
    <p class="tagline">세상에서 제일 귀여운 고양이</p>

    <h2>쿠키가 좋아하는 것</h2>
    <ul>
      <li><span>🍡</span> 츄르 먹기</li>
      <li><span>😴</span> 햇살 아래 낮잠</li>
      <li><span>📦</span> 상자 속에 숨기</li>
    </ul>

    <footer>오늘도 쿠키는 귀여워요 🐾</footer>
  </main>
</body>
</html>
